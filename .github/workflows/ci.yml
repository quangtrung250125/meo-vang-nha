name: Kiểm tra tự động

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài đặt
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test logic (Vitest)
        run: npm run test:unit

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Test trên trình duyệt (Playwright)
        run: npm run test:e2e

      - name: Lưu báo cáo khi test lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
